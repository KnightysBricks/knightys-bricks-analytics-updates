name: Publish Windows update

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and unwrap Windows package
        run: |
          curl --fail --location --retry 2 "https://github.com/KnightysBricks/knightys-bricks-analytics-updates/releases/download/v0.2.0/Knightys-Bricks-Analytics-Windows.zip" --output artifact.zip
          unzip -p artifact.zip Knightys-Bricks-Analytics-Windows.zip > Knightys-Bricks-Analytics-Windows.zip
          test "$(stat -c%s Knightys-Bricks-Analytics-Windows.zip)" -gt 1000000
          unzip -l Knightys-Bricks-Analytics-Windows.zip
          unzip -t Knightys-Bricks-Analytics-Windows.zip
      - name: Replace public update asset with installer ZIP
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: Knighty's Bricks Analytics v0.2.0
          body: "First updater-enabled Windows release. This package contains the application only; inventory databases and credentials are not included."
          files: Knightys-Bricks-Analytics-Windows.zip
          overwrite_files: true
