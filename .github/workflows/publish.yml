name: Publish Windows update

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read application version
        id: app_version
        run: echo "version=$(tr -d '\r\n' < VERSION)" >> "$GITHUB_OUTPUT"
      - name: Download and verify Windows package
        run: |
          test -f .release-source-url
          SOURCE_URL="$(cat .release-source-url)"
          case "$SOURCE_URL" in https://*) ;; *) echo "Invalid staged download URL"; exit 1;; esac
          curl --fail --location --retry 2 -H "Accept: application/octet-stream" -H "X-GitHub-Api-Version: 2022-11-28" "$SOURCE_URL" --output source.zip
          if unzip -Z1 source.zip | grep -Fxq "Knightys-Bricks-Analytics-Windows.zip"; then
            unzip -p source.zip Knightys-Bricks-Analytics-Windows.zip > Knightys-Bricks-Analytics-Windows.zip
          else
            cp source.zip Knightys-Bricks-Analytics-Windows.zip
          fi
          test "$(stat -c%s Knightys-Bricks-Analytics-Windows.zip)" -gt 1000000
          unzip -t Knightys-Bricks-Analytics-Windows.zip
          unzip -Z1 Knightys-Bricks-Analytics-Windows.zip | grep -Fx "Knightys Bricks Analytics.exe"
      - name: Publish Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.app_version.outputs.version }}
          name: Knighty's Bricks Analytics v${{ steps.app_version.outputs.version }}
          body: "Windows release v${{ steps.app_version.outputs.version }}. The package contains the application and installer only; inventory databases and credentials are not included."
          files: Knightys-Bricks-Analytics-Windows.zip
          overwrite_files: true
      - name: Remove temporary staging URL
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .release-source-url
          git commit -m "Remove temporary release staging URL"
          git push
