name: Publish Windows update

on:
  push:
    branches: [main]
    paths:
      - "VERSION"
      - "Knightys-Bricks-Analytics-Windows.zip"
      - ".release-source-url"
      - ".github/workflows/publish.yml"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download staged first release package
        if: hashFiles('.release-source-url') != ''
        run: |
          curl --fail --location --retry 2 "$(cat .release-source-url)" --output Knightys-Bricks-Analytics-Windows.zip
          test "$(stat -c%s Knightys-Bricks-Analytics-Windows.zip)" -gt 1000000
          unzip -t Knightys-Bricks-Analytics-Windows.zip
      - name: Publish public update release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: Knighty's Bricks Analytics v0.2.0
          body: "First updater-enabled Windows release. This package contains the application only; inventory databases and credentials are not included."
          files: Knightys-Bricks-Analytics-Windows.zip
      - name: Remove temporary package URL
        if: hashFiles('.release-source-url') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .release-source-url
          git commit -m "Remove temporary release package URL"
          git push
