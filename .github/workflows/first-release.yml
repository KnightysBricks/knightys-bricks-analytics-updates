name: Publish first public Windows update

on:
  push:
    paths:
      - ".release-source-url"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release package
        run: |
          curl --fail --location --retry 2 "$(cat .release-source-url)" --output Knightys-Bricks-Analytics-Windows.zip
          test "$(stat -c%s Knightys-Bricks-Analytics-Windows.zip)" -gt 1000000
          unzip -t Knightys-Bricks-Analytics-Windows.zip
      - name: Publish public release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.0
          name: Knighty's Bricks Analytics v0.2.0
          body: "First updater-enabled Windows release. The installer contains the application only; inventory databases and credentials are not included."
          files: Knightys-Bricks-Analytics-Windows.zip
      - name: Remove temporary download URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .release-source-url
          git commit -m "Remove temporary release package URL"
          git push
